name: Build Flutter App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
      
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink
