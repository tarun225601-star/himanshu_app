<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Uploader and Audio Selector</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="h-screen flex flex-col items-center justify-center bg-gray-100">
    <h1 class="text-3xl mb-4">Media Uploader and Audio Selector</h1>
    <div class="flex flex-col items-center justify-center">
        <input type="file" id="media-input" accept="image/*, video/*" class="mb-4">
        <div id="media-preview" class="mb-4"></div>
        <select id="audio-selector" class="mb-4">
            <option value="">Select Background Music</option>
            <option value="lo-fi">Lo-Fi</option>
            <option value="peppy">Peppy</option>
            <option value="hype-beats">Hype Beats</option>
        </select>
    </div>

    <script>
        const mediaInput = document.getElementById('media-input');
        const mediaPreview = document.getElementById('media-preview');
        const audioSelector = document.getElementById('audio-selector');

        mediaInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                const mediaURL = event.target.result;
                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = mediaURL;
                    mediaPreview.innerHTML = '';
                    mediaPreview.appendChild(img);
                } else if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.src = mediaURL;
                    video.controls = true;
                    mediaPreview.innerHTML = '';
                    mediaPreview.appendChild(video);
                }
            };
            reader.readAsDataURL(file);
        });

        audioSelector.addEventListener('change', (e) => {
            const selectedTrack = e.target.value;
            console.log(`Background music track selected: ${selectedTrack}`);
            if (selectedTrack === 'lo-fi') {
                // Play Lo-Fi music
                const audio = new Audio('https://example.com/lo-fi.mp3');
                audio.play();
            } else if (selectedTrack === 'peppy') {
                // Play Peppy music
                const audio = new Audio('https://example.com/peppy.mp3');
                audio.play();
            } else if (selectedTrack === 'hype-beats') {
                // Play Hype Beats music
                const audio = new Audio('https://example.com/hype-beats.mp3');
                audio.play();
            }
        });
    </script>
</body>
</html>
