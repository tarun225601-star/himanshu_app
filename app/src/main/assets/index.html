<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
</head>
<body class="h-screen bg-gray-100 flex justify-center items-center">
    <div class="bg-white p-8 rounded shadow-md w-80">
        <input type="text" id="display" class="w-full p-2 text-2xl text-right border border-gray-300 rounded" disabled>
        <div class="grid grid-cols-4 gap-2 mt-4">
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="clearDisplay()">C</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="deleteChar()">DEL</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('%')">%</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('/')">/</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('7')">7</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('8')">8</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('9')">9</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('*')">*</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('4')">4</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('5')">5</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('6')">6</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('-')">-</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('1')">1</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('2')">2</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('3')">3</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('+')">+</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('0')">0</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('.')">.</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('=')">=</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('')">SPACE</button>
            <button class="p-2 text-xl border border-gray-300 rounded" onclick="calculate('')">SPACE</button>
        </div>
    </div>
    <script>
        let display = document.getElementById('display');
        let currentNumber = '';
        let previousNumber = '';
        let operation = '';

        function calculate(input) {
            if (input === '=') {
                if (currentNumber !== '' && previousNumber !== '' && operation !== '') {
                    let result = eval(previousNumber + operation + currentNumber);
                    display.value = result;
                    currentNumber = result.toString();
                    previousNumber = '';
                    operation = '';
                }
            } else if (input === 'C') {
                display.value = '';
                currentNumber = '';
                previousNumber = '';
                operation = '';
            } else if (input === 'DEL') {
                if (currentNumber !== '') {
                    currentNumber = currentNumber.slice(0, -1);
                    display.value = currentNumber;
                } else if (operation !== '') {
                    operation = '';
                    display.value = previousNumber;
                    currentNumber = '';
                } else if (previousNumber !== '') {
                    previousNumber = previousNumber.slice(0, -1);
                    display.value = previousNumber;
                }
            } else if (['+', '-', '*', '/'].includes(input)) {
                if (currentNumber !== '') {
                    previousNumber = currentNumber;
                    operation = input;
                    currentNumber = '';
                    display.value = previousNumber + operation;
                }
            } else if (input === '%') {
                if (currentNumber !== '') {
                    currentNumber = (currentNumber / 100).toString();
                    display.value = currentNumber;
                }
            } else {
                currentNumber += input;
                display.value = currentNumber;
            }
        }

        function clearDisplay() {
            display.value = '';
            currentNumber = '';
            previousNumber = '';
            operation = '';
        }

        function deleteChar() {
            if (currentNumber !== '') {
                currentNumber = currentNumber.slice(0, -1);
                display.value = currentNumber;
            } else if (operation !== '') {
                operation = '';
                display.value = previousNumber;
                currentNumber = '';
            } else if (previousNumber !== '') {
                previousNumber = previousNumber.slice(0, -1);
                display.value = previousNumber;
            }
        }
    </script>
</body>
</html>
