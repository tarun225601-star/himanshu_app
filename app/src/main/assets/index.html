<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="h-screen bg-gray-100 flex justify-center items-center">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 flex flex-col w-80">
        <input type="text" id="display" class="text-3xl font-bold text-right p-4 mb-4 border-b border-gray-200" disabled>
        <div class="grid grid-cols-4 gap-2">
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="clearDisplay()">C</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="backspace()">DEL</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('%')">%</button>
            <button class="bg-orange-500 hover:bg-orange-600 text-2xl font-bold p-4 text-white" onclick="calculate('/')">/</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('7')">7</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('8')">8</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('9')">9</button>
            <button class="bg-orange-500 hover:bg-orange-600 text-2xl font-bold p-4 text-white" onclick="calculate('*')">*</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('4')">4</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('5')">5</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('6')">6</button>
            <button class="bg-orange-500 hover:bg-orange-600 text-2xl font-bold p-4 text-white" onclick="calculate('-')">-</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('1')">1</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('2')">2</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('3')">3</button>
            <button class="bg-orange-500 hover:bg-orange-600 text-2xl font-bold p-4 text-white" onclick="calculate('+')">+</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('0')">0</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('.')">.</button>
            <button class="bg-gray-200 hover:bg-gray-300 text-2xl font-bold p-4" onclick="calculate('=')">=</button>
            <button class="bg-orange-500 hover:bg-orange-600 text-2xl font-bold p-4 text-white" onclick="calculate('')">ENTER</button>
        </div>
    </div>
    <script>
        let display = document.getElementById('display');
        let currentNumber = '';
        let previousNumber = '';
        let operator = '';

        function calculate(key) {
            if (key === 'C') {
                clearDisplay();
            } else if (key === 'DEL') {
                backspace();
            } else if (key === '=') {
                if (currentNumber !== '' && previousNumber !== '' && operator !== '') {
                    let result = eval(previousNumber + operator + currentNumber);
                    display.value = result;
                    previousNumber = result.toString();
                    currentNumber = '';
                    operator = '';
                }
            } else if (key === '+' || key === '-' || key === '*' || key === '/' || key === '%') {
                if (currentNumber !== '') {
                    previousNumber = currentNumber;
                    operator = key;
                    currentNumber = '';
                }
            } else {
                currentNumber += key;
                display.value = previousNumber + operator + currentNumber;
            }
        }

        function clearDisplay() {
            display.value = '';
            currentNumber = '';
            previousNumber = '';
            operator = '';
        }

        function backspace() {
            if (currentNumber !== '') {
                currentNumber = currentNumber.slice(0, -1);
                display.value = previousNumber + operator + currentNumber;
            }
        }
    </script>
</body>
</html>
