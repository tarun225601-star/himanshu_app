<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #121212;
        }
        .display {
            background-color: #333;
            color: #fff;
            padding: 20px;
            font-size: 48px;
            text-align: right;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 20px;
        }
        .keypad button {
            padding: 20px;
            font-size: 24px;
            border-radius: 12px;
            background-color: #444;
            color: #fff;
            border: none;
        }
        .keypad button:hover {
            background-color: #555;
        }
        .keypad button:active {
            background-color: #666;
        }
        .equals {
            grid-row: span 2;
        }
    </style>
</head>
<body>
    <div class="h-screen flex flex-col">
        <div class="display h-20 overflow-hidden border-b border-gray-600">
            <p id="display">0</p>
        </div>
        <div class="keypad flex-grow">
            <button class="bg-red-600 hover:bg-red-700 active:bg-red-800" onclick="clearDisplay()">C</button>
            <button onclick="appendOperator('/')">÷</button>
            <button onclick="appendOperator('*')">×</button>
            <button class="bg-red-600 hover:bg-red-700 active:bg-red-800" onclick="deleteLastCharacter()">DEL</button>
            <button onclick="appendNumber(7)">7</button>
            <button onclick="appendNumber(8)">8</button>
            <button onclick="appendNumber(9)">9</button>
            <button onclick="appendOperator('/')">÷</button>
            <button onclick="appendNumber(4)">4</button>
            <button onclick="appendNumber(5)">5</button>
            <button onclick="appendNumber(6)">6</button>
            <button onclick="appendOperator('-')">-</button>
            <button onclick="appendNumber(1)">1</button>
            <button onclick="appendNumber(2)">2</button>
            <button onclick="appendNumber(3)">3</button>
            <button onclick="appendOperator('+')">+</button>
            <button onclick="appendNumber(0)">0</button>
            <button onclick="appendDecimal()">.</button>
            <button class="equals" onclick="calculateResult()">=</button>
        </div>
    </div>
    <script>
        let display = document.getElementById('display');
        let currentNumber = '0';
        let previousNumber = '';
        let operator = '';

        function appendNumber(number) {
            if (currentNumber === '0') {
                currentNumber = number.toString();
            } else {
                currentNumber += number.toString();
            }
            display.textContent = currentNumber;
        }

        function appendDecimal() {
            if (!currentNumber.includes('.')) {
                currentNumber += '.';
                display.textContent = currentNumber;
            }
        }

        function appendOperator(op) {
            previousNumber = currentNumber;
            operator = op;
            currentNumber = '0';
        }

        function clearDisplay() {
            currentNumber = '0';
            previousNumber = '';
            operator = '';
            display.textContent = currentNumber;
        }

        function deleteLastCharacter() {
            if (currentNumber.length > 1) {
                currentNumber = currentNumber.slice(0, -1);
            } else {
                currentNumber = '0';
            }
            display.textContent = currentNumber;
        }

        function calculateResult() {
            let result;
            switch (operator) {
                case '+':
                    result = parseFloat(previousNumber) + parseFloat(currentNumber);
                    break;
                case '-':
                    result = parseFloat(previousNumber) - parseFloat(currentNumber);
                    break;
                case '*':
                    result = parseFloat(previousNumber) * parseFloat(currentNumber);
                    break;
                case '/':
                    result = parseFloat(previousNumber) / parseFloat(currentNumber);
                    break;
                default:
                    result = currentNumber;
            }
            display.textContent = result.toString();
            currentNumber = result.toString();
            previousNumber = '';
            operator = '';
        }
    </script>
</body>
</html>
