<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
</head>
<body class="h-screen bg-gray-100 flex justify-center items-center">
    <div class="bg-white rounded-lg shadow-lg p-8 w-80">
        <input type="text" id="display" class="w-full h-12 text-3xl text-right p-2 border border-gray-300 rounded-lg" disabled>
        <div class="grid grid-cols-4 gap-2 mt-4">
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="clearDisplay()">C</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="deleteLastChar()">DEL</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate()">=</button>
            <button class="h-12 text-xl font-bold bg-orange-500 hover:bg-orange-600 text-white rounded-lg" onclick="updateDisplay('/')">/</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('7')">7</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('8')">8</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('9')">9</button>
            <button class="h-12 text-xl font-bold bg-orange-500 hover:bg-orange-600 text-white rounded-lg" onclick="updateDisplay('*')">*</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('4')">4</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('5')">5</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('6')">6</button>
            <button class="h-12 text-xl font-bold bg-orange-500 hover:bg-orange-600 text-white rounded-lg" onclick="updateDisplay('-')">-</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('1')">1</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('2')">2</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('3')">3</button>
            <button class="h-12 text-xl font-bold bg-orange-500 hover:bg-orange-600 text-white rounded-lg" onclick="updateDisplay('+')">+</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('0')">0</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('.')">.</button>
            <button class="h-12 text-xl font-bold bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="updateDisplay('%')">%</button>
            <button class="h-12 text-xl font-bold bg-orange-500 hover:bg-orange-600 text-white rounded-lg" onclick="calculate()">=</button>
        </div>
    </div>
    <script>
        let display = document.getElementById('display');
        let currentExpression = '';

        function updateDisplay(value) {
            currentExpression += value;
            display.value = currentExpression;
        }

        function clearDisplay() {
            currentExpression = '';
            display.value = currentExpression;
        }

        function deleteLastChar() {
            currentExpression = currentExpression.slice(0, -1);
            display.value = currentExpression;
        }

        function calculate() {
            try {
                let result = eval(currentExpression);
                display.value = result;
                currentExpression = result.toString();
            } catch (e) {
                display.value = 'Error';
                currentExpression = '';
            }
        }
    </script>
</body>
</html>
