<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="h-screen bg-gray-100 flex justify-center items-center">
    <div class="bg-white rounded-lg shadow-md p-4 w-80">
        <input type="text" id="display" class="w-full h-12 text-3xl text-right p-2 border border-gray-300 rounded-lg" disabled>
        <div class="grid grid-cols-4 gap-2 mt-4">
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="clearDisplay()">C</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="backspace()">DEL</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('%')">%</button>
            <button class="h-12 text-xl bg-orange-500 hover:bg-orange-600 text-white rounded-lg" onclick="calculate('/')">/</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('7')">7</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('8')">8</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('9')">9</button>
            <button class="h-12 text-xl bg-orange-500 hover:bg-orange-600 text-white rounded-lg" onclick="calculate('*')">*</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('4')">4</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('5')">5</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('6')">6</button>
            <button class="h-12 text-xl bg-orange-500 hover:bg-orange-600 text-white rounded-lg" onclick="calculate('-')">-</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('1')">1</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('2')">2</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('3')">3</button>
            <button class="h-12 text-xl bg-orange-500 hover:bg-orange-600 text-white rounded-lg" onclick="calculate('+')">+</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('0')">0</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg" onclick="calculate('.')">.</button>
            <button class="h-12 text-xl bg-orange-500 hover:bg-orange-600 text-white rounded-lg" onclick="calculate('=')">=</button>
            <button class="h-12 text-xl bg-gray-200 hover:bg-gray-300 rounded-lg col-span-4" onclick="clearDisplay()">Clear All</button>
        </div>
    </div>
    <script>
        let display = document.getElementById('display');
        let expression = '';

        function calculate(value) {
            if (value === '=') {
                try {
                    display.value = eval(expression);
                    expression = display.value;
                } catch (e) {
                    display.value = 'Error';
                    expression = '';
                }
            } else {
                expression += value;
                display.value = expression;
            }
        }

        function clearDisplay() {
            display.value = '';
            expression = '';
        }

        function backspace() {
            expression = expression.slice(0, -1);
            display.value = expression;
        }
    </script>
</body>
</html>
