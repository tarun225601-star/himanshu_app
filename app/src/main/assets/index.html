<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-black text-white">

        <a href="#" class="text-white hover:text-gray-300">

            </svg>

        <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14v6m-3-3h6M6 10h9a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2m0-4h9a2 2 0 002-2v2a2 2 0 00-2 2h-9a2 2 0 00-2-2V6a2 2 0 002-2z" />
            </svg>
        </a>
        <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.03 2.03 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
        </a>
        <a href="#" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.005 13.005 0 008 14.118a143.94 143.94 0 005.886 0 13.006 13.006 0 003.102-7.518 4 4 0 01-.707 2.165 10.002 10.002 0 001.156 3.842 4 4 0 01-2.833 3.197z" />

    </nav>
    <div class="container mx-auto p-4 pt-6 md:p-6 lg:p-12 xl:p-24">
        <div class="grid grid-cols-1 gap-4">
            <div class="relative">
                <video class="w-full h-64 object-cover" autoplay loop>
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                </video>
                <div class="absolute bottom-0 left-0 right-0 p-2 bg-gray-800 bg-opacity-50">
                    <h2 class="text-lg font-bold">Video Title</h2>
                    <p class="text-sm">Description</p>
                </div>
            </div>
            <div class="flex justify-between">
                <button class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                    </svg>
                </button>
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </button>
                <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </button>
            </div>
            <div class="flex justify-between">
                <h2 class="text-lg font-bold">Comments</h2>
                <button class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </button>
            </div>
            <div class="grid grid-cols-1 gap-4">
                <div class="flex justify-between">
                    <h2 class="text-lg font-bold">User Profile</h2>
                    <button class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </button>
                </div>
                <div class="flex justify-between">
                    <p class="text-sm">Username: <span class="font-bold">JohnDoe</span></p>
                    <p class="text-sm">Followers: <span class="font-bold">1000</span></p>
                </div>
                <div class="flex justify-between">
                    <p class="text-sm">Likes: <span class="font-bold">10000</span></p>
                    <p class="text-sm">Videos: <span class="font-bold">50</span></p>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Upload & Media Picker
        const uploadButton = document.querySelector('#upload-button');
        const mediaPicker = document.querySelector('#media-picker');
        
        uploadButton.addEventListener('click', () => {
            mediaPicker.click();
        });
        
        mediaPicker.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.addEventListener('load', () => {
                const imageData = reader.result;
                // Upload image data to server
            });
            
            reader.readAsDataURL(file);
        });
        
        // Audio/Music Integration
        const audioButton = document.querySelector('#audio-button');
        const audioTracks = document.querySelector('#audio-tracks');
        
        audioButton.addEventListener('click', () => {
            audioTracks.classList.toggle('hidden');
        });
        
        // Interaction System (Like & Comment)
        const likeButton = document.querySelector('#like-button');
        const commentButton = document.querySelector('#comment-button');
        const commentsSection = document.querySelector('#comments-section');
        
        likeButton.addEventListener('click', () => {
            // Like video logic
        });
        
        commentButton.addEventListener('click', () => {
            commentsSection.classList.toggle('hidden');
        });
        
        // User Profile Screen
        const userProfileButton = document.querySelector('#user-profile-button');
        const userProfileSection = document.querySelector('#user-profile-section');
        
        userProfileButton.addEventListener('click', () => {
            userProfileSection.classList.toggle('hidden');
        });
    </script>
</body>
</html>
